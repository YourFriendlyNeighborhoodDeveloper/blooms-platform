name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: blooms
          POSTGRES_PASSWORD: blooms_dev_only
          POSTGRES_DB: blooms_dev
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U blooms"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      stripe-mock:
        image: stripe/stripe-mock:latest
        ports:
          - 12111:12111
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 8025:8025
          - 1025:1025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit, integration, database and adapter tests
        run: npm test
        env:
          STRIPE_MOCK_PORT: 12111
          MAILPIT_URL: http://127.0.0.1:8025
          SMTP_TEST_URL: smtp://127.0.0.1:1025
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Static concept build still works
        run: npm run build:concept && npm run smoke
