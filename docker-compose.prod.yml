# A complete deployment for a single server: web, worker, database, HTTPS and nightly backups.
# Copy .env.example to .env.production and fill it in first. See docs/operations.md.
name: blooms-prod

x-app: &app
  image: blooms-platform:${BLOOMS_VERSION:-latest}
  restart: unless-stopped
  env_file: .env.production
  environment:
    DATABASE_URL: postgres://blooms:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/blooms
    TRUST_PROXY: 'true'
  volumes:
    - storage:/app/storage
  depends_on:
    db:
      condition: service_healthy

services:
  web:
    <<: *app
    # Built once here. The worker runs the same image.
    build:
      context: .
      args:
        SITE_MODE: ${SITE_MODE:-preview}
        SITE_URL: ${PUBLIC_BASE_URL:-}
    environment:
      DATABASE_URL: postgres://blooms:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/blooms
      TRUST_PROXY: 'true'
      SERVE_STATIC: 'true'
      WORKER_EMBEDDED: 'false'
      SITE_MODE: ${SITE_MODE:-preview}
    command: ['node', 'dist-server/index.js']

  worker:
    <<: *app
    pull_policy: never
    environment:
      DATABASE_URL: postgres://blooms:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/blooms
    command: ['node', 'dist-server/worker.js']
    healthcheck:
      disable: true

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: blooms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: blooms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blooms']
      interval: 5s
      timeout: 3s
      retries: 20

  # Nightly compressed dumps, kept for BACKUP_KEEP_DAYS. Copy them off this server as well.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        while true; do
          file=/backups/blooms-$$(date -u +%Y%m%dT%H%M%SZ).dump
          if pg_dump -h db -U blooms -d blooms --format=custom --no-owner --file="$$file.partial"; then
            mv "$$file.partial" "$$file" && echo "backup written: $$file"
          else
            rm -f "$$file.partial"; echo "BACKUP FAILED" >&2
          fi
          find /backups -name 'blooms-*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
